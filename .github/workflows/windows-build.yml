name: Reusable Windows build and installer
on:
  workflow_call:
    inputs:
      ref:
        description: Exact 40-character commit SHA to build
        required: true
        type: string
      release:
        description: Require trusted signing and reviewed corresponding sources
        type: boolean
        default: false
      artifact_name:
        description: Release artifact name, or development artifact prefix
        required: true
        type: string
permissions:
  contents: read
jobs:
  development:
    if: ${{ !inputs.release }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.403
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make patch diffutils git findutils curl
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-pixman
            mingw-w64-ucrt-x86_64-libslirp
            mingw-w64-ucrt-x86_64-dtc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-pkgconf
      - uses: actions/cache/restore@v4
        id: qemu_cache
        with:
          path: _output/windows-deps
          key: cage-windows-deps-${{ hashFiles('packaging/windows/dependencies.json', 'patches/qemu/**', 'scripts/build-qemu-windows.*') }}
          restore-keys: cage-windows-deps-
      - name: Build and verify QEMU runtime before application acceptance
        env:
          CAGE_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: ./scripts/build-qemu-windows.ps1
      - name: Preserve only the completed verified runtime cache
        if: steps.qemu_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: _output/windows-deps
          key: cage-windows-deps-${{ hashFiles('packaging/windows/dependencies.json', 'patches/qemu/**', 'scripts/build-qemu-windows.*') }}
      - name: Build, test and install the unsigned development package
        env:
          CAGE_BUILD_REF: ${{ inputs.ref }}
          CAGE_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: ./scripts/ci-windows-build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}-${{ matrix.os }}
          path: _output/releases/*/windows/*
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Preserve failed unsigned candidates for installation debugging
        if: ${{ always() && job.status != 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}-${{ matrix.os }}-failed-candidate
          path: |
            _output/windows-amd64/app/**
            _output/releases/*/windows/Cage-*-windows-amd64-setup-unsigned.exe
            _output/releases/*/windows/SHA256SUMS
          if-no-files-found: ignore
          compression-level: 0
          overwrite: true
          retention-days: 14
      - name: Preserve public test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}-${{ matrix.os }}-reports
          path: |
            ${{ runner.temp }}/cage-smoke-*.json
            ${{ runner.temp }}/cage-build-ui-*/smoke.json
            ${{ runner.temp }}/cage-build-diagnostics-*/diagnostics.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14
  release:
    if: ${{ inputs.release }}
    runs-on: windows-2025
    environment: cage-release
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.403
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make patch diffutils git findutils curl
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-pixman
            mingw-w64-ucrt-x86_64-libslirp
            mingw-w64-ucrt-x86_64-dtc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-pkgconf
      - uses: actions/cache/restore@v4
        id: qemu_cache
        with:
          path: _output/windows-deps
          restore-keys: cage-windows-deps-
          key: cage-windows-deps-${{ hashFiles('packaging/windows/dependencies.json', 'patches/qemu/**', 'scripts/build-qemu-windows.*') }}
      - name: Build and verify QEMU runtime and package identity
        id: qemu_build
        env:
          CAGE_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          ./scripts/build-qemu-windows.ps1
          $identity = Get-Content '_output/windows-deps/qemu-cage/cage-build.json' -Raw | ConvertFrom-Json
          "fingerprint=$($identity.fingerprint)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "manifest=$((Get-FileHash '_output/windows-deps/qemu-cage/cage-build.json' -Algorithm SHA256).Hash)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $collectorHash = (Get-FileHash 'scripts/bundle-qemu-sources.sh' -Algorithm SHA256).Hash + (Get-FileHash 'scripts/prepare-qemu-release.ps1' -Algorithm SHA256).Hash
          "collector=$collectorHash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Preserve only the completed verified runtime cache
        if: steps.qemu_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: _output/windows-deps
          key: cage-windows-deps-${{ hashFiles('packaging/windows/dependencies.json', 'patches/qemu/**', 'scripts/build-qemu-windows.*') }}
      - uses: actions/cache/restore@v4
        id: qemu_sources
        with:
          path: _output/windows-qemu-sources
          key: cage-qemu-sources-${{ steps.qemu_build.outputs.fingerprint }}-${{ steps.qemu_build.outputs.manifest }}-${{ steps.qemu_build.outputs.collector }}
      - name: Collect and verify corresponding sources before signing
        env:
          CAGE_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: ./scripts/prepare-qemu-release.ps1
      - name: Preserve only the completed verified source cache
        if: steps.qemu_sources.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: _output/windows-qemu-sources
          key: cage-qemu-sources-${{ steps.qemu_build.outputs.fingerprint }}-${{ steps.qemu_build.outputs.manifest }}-${{ steps.qemu_build.outputs.collector }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build, sign, test and install the release candidate
        env:
          CAGE_BUILD_REF: ${{ inputs.ref }}
          CAGE_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
          CAGE_WINDOWS_SIGNING_PROVIDER: ${{ vars.CAGE_WINDOWS_SIGNING_PROVIDER }}
          CAGE_ESIGNER_USERNAME: ${{ secrets.CAGE_ESIGNER_USERNAME }}
          CAGE_ESIGNER_PASSWORD: ${{ secrets.CAGE_ESIGNER_PASSWORD }}
          CAGE_ESIGNER_CREDENTIAL_ID: ${{ secrets.CAGE_ESIGNER_CREDENTIAL_ID }}
          CAGE_ESIGNER_CERTIFICATE_SERIAL: ${{ vars.CAGE_ESIGNER_CERTIFICATE_SERIAL }}
          CAGE_ESIGNER_TOTP_SECRET: ${{ secrets.CAGE_ESIGNER_TOTP_SECRET }}
          CAGE_WINDOWS_PFX_BASE64: ${{ secrets.CAGE_WINDOWS_PFX_BASE64 }}
          CAGE_WINDOWS_PFX_PASSWORD: ${{ secrets.CAGE_WINDOWS_PFX_PASSWORD }}
        run: ./scripts/ci-windows-build.ps1 -Release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            _output/releases/*/windows/Cage-*-windows-amd64-setup.exe
            _output/releases/*/windows/SHA256SUMS
            _output/releases/*/windows/mihomo-*-source.tar.gz
            _output/releases/*/windows/qemu-*-source.tar.gz
            _output/releases/*/windows/qemu-*-windows-full-source.*
            _output/releases/*/windows/build-metadata.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Preserve public release acceptance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}-reports
          path: |
            ${{ runner.temp }}/cage-smoke-*.json
            ${{ runner.temp }}/cage-build-ui-*/smoke.json
            ${{ runner.temp }}/cage-build-diagnostics-*/diagnostics.json
          if-no-files-found: ignore
          retention-days: 14
      # The caller owns publication. This workflow has no repository write access.
